# Morning Round — Maren's water app: where to go first, then where, and why.
# http://localhost:4004/app/water/index.html — TypeScript is transpiled on the fly.
specVersion: "3.0"
metadata:
  name: oakhaven.waterapp
type: application
customConfiguration:
  cds-plugin-ui5:
    mountPath: /app/water
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
framework:
  name: SAPUI5
  version: "1.136.0"
  libraries:
    - name: sap.m
    - name: sap.f
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: themelib_sap_horizon
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        transformTypeScript: true
        altTsConfig: ../../tsconfig.json
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        transformTypeScript: true
        altTsConfig: ../../tsconfig.json
