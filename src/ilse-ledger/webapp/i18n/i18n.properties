# Questions for the owner of a register
askIntro=Geen verdenking. Iemand schreef in het register van een ander (bijvoorbeeld Maren in de voorraad). Of dat mocht, weet alleen de eigenaar van het register: vraag het na. Deze records tellen niet mee als verdacht.
