# The Oakhaven Hunt — a clickable village map for the children: visit places, meet the villagers, collect stamps.
# http://localhost:4004/app/hunt/index.html
specVersion: "3.0"
metadata:
  name: oakhaven.hunt
type: application
customConfiguration:
  cds-plugin-ui5:
    mountPath: /app/hunt
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
framework:
  name: SAPUI5
  version: "1.136.0"
  libraries:
    - name: sap.m
    - name: sap.f
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: themelib_sap_horizon
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        transformTypeScript: true
        altTsConfig: ../../tsconfig.json
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        transformTypeScript: true
        altTsConfig: ../../tsconfig.json
