# The Council's Monday (Rowan). cds-plugin-ui5 serves it at `mountPath` while `cds watch` runs:
# http://localhost:4004/app/rowan/index.html — TypeScript is transpiled on the fly.
specVersion: "3.0"
metadata:
  name: rowan.council
type: application
customConfiguration:
  cds-plugin-ui5:
    mountPath: /app/rowan
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
framework:
  name: SAPUI5
  version: "1.136.0"
  libraries:
    - name: sap.m
    - name: sap.f
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: themelib_sap_horizon
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        transformTypeScript: true
        altTsConfig: ../../tsconfig.json
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        transformTypeScript: true
        altTsConfig: ../../tsconfig.json
